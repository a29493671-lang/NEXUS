
name: NEXUS Docker Build Pipeline

on:
  push:
    branches:
      - main
      - feature/frontend-ui-refresh

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./nexus-platform
          file: ./nexus-platform/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/a29493671-lang/nexus-backend:latest

      - name: Build Demo Image
        uses: docker/build-push-action@v6
        with:
          context: ./nexus-demo-app
          file: ./nexus-demo-app/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/a29493671-lang/nexus-demo:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./nexus-frontend
          file: ./nexus-frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/a29493671-lang/nexus-frontend:latest
